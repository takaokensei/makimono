plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "androidx.navigation.safeargs.kotlin"
    id "kotlin-kapt"
    id "dagger.hilt.android.plugin"
}

// Local release-signing settings are read from local.properties, which is
// git-ignored and is never embedded into the application BuildConfig.
def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing: optional dedicated keystore, configured via local.properties
// (release.storeFile / release.storePassword / release.keyAlias / release.keyPassword).
// When absent, local/personal release builds explicitly fall back to the debug
// key so the build never fails silently on a developer machine.
//
// In CI, a release must never silently fall back to the debug key. Keep the
// guard scoped to release-producing tasks so lint, tests, and debug builds can
// run in CI without a release keystore.
def releaseStoreFile = localProperties.getProperty("release.storeFile", "")
def hasReleaseSigningConfig = !releaseStoreFile.isEmpty()
def isCiEnv = System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true"
def allowDebugSigningInCi = project.hasProperty("allowDebugSigningInCi") ||
        System.getenv("ALLOW_DEBUG_SIGNING_IN_CI") == "true"

if (!hasReleaseSigningConfig) {
    logger.warn(
        "WARNING: No release.storeFile configured in local.properties. " +
        "Release build will be signed with the DEBUG key. " +
        "This is fine for personal/local builds, but such an APK must not be " +
        "distributed as if it were a production release. " +
        "See local.properties.example for how to configure a real release keystore."
    )
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTasks = ["assembleRelease", "bundleRelease", "packageRelease"]
    def isBuildingRelease = taskGraph.allTasks.any { task ->
        task.project == project && releaseTasks.contains(task.name)
    }
    if (isBuildingRelease && isCiEnv && !hasReleaseSigningConfig && !allowDebugSigningInCi) {
        throw new GradleException(
            "Refusing to build a release in CI without a release keystore. " +
            "Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, " +
            "RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD, or pass " +
            "-PallowDebugSigningInCi to override intentionally."
        )
    }
}

android {
    sourceSets.androidTest.assets.srcDirs += files("$projectDir/schemas")

    namespace "zechs.drive.stream"

    packagingOptions {
        exclude "META-INF/DEPENDENCIES"
    }

    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "zechs.drive.stream"
        minSdk 21
        targetSdk 33
        versionCode 60
        versionName "1.6.4.8"
        archivesBaseName = "makimono-v${versionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def driveClientId = localProperties.getProperty("drive.clientId", "") ?: (System.getenv("DRIVE_CLIENT_ID") ?: (System.getenv("GOOGLE_DRIVE_CLIENT_ID") ?: ""))
        def distributionBuild = project.hasProperty("distributionBuild")
        def driveClientSecret = distributionBuild ? "" : (localProperties.getProperty("drive.clientSecret", "") ?: (System.getenv("DRIVE_CLIENT_SECRET") ?: (System.getenv("GOOGLE_DRIVE_CLIENT_SECRET") ?: "")))
        def driveRefreshToken = distributionBuild ? "" : (localProperties.getProperty("drive.refreshToken", "") ?: (System.getenv("DRIVE_REFRESH_TOKEN") ?: (System.getenv("GOOGLE_DRIVE_REFRESH_TOKEN") ?: "")))
        def malClientId = localProperties.getProperty("mal.clientId", "") ?: (System.getenv("MAL_CLIENT_ID") ?: "")
        def malClientSecret = distributionBuild ? "" : (localProperties.getProperty("mal.clientSecret", "") ?: (System.getenv("MAL_CLIENT_SECRET") ?: ""))
        def rawGithubToken = localProperties.getProperty("github.releaseReadToken", "") ?: localProperties.getProperty("github.apiToken", "") ?: (System.getenv("API_TOKEN_GITHUB") ?: (System.getenv("GITHUB_API_TOKEN") ?: ""))
        def githubApiToken = rawGithubToken
                .replace("\\", "\\\\")
                .replace("\"", "\\\"")
                .replace("\r", "")
                .replace("\n", "")
        def tmdbApiKey = (localProperties.getProperty("tmdb.apiKey", "") ?: (System.getenv("TMDB_API_KEY") ?: "15d2ea6d0dc1d476efbca3eba2b9bbfb")).trim()

        buildConfigField "String", "DRIVE_CLIENT_ID", "\"${driveClientId}\""
        buildConfigField "String", "DRIVE_CLIENT_SECRET", "\"${driveClientSecret}\""
        buildConfigField "String", "DRIVE_REFRESH_TOKEN", "\"${driveRefreshToken}\""
        buildConfigField "String", "MAL_CLIENT_ID", "\"${malClientId}\""
        buildConfigField "String", "MAL_CLIENT_SECRET", "\"${malClientSecret}\""
        buildConfigField "String", "GITHUB_API_TOKEN", "\"${githubApiToken}\""
        buildConfigField "String", "TMDB_API_KEY", "\"${tmdbApiKey}\""
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile)
                storePassword localProperties.getProperty("release.storePassword", "")
                keyAlias localProperties.getProperty("release.keyAlias", "")
                keyPassword localProperties.getProperty("release.keyPassword", "")
            }
        }
    }

    buildTypes {
        // Keep the debug-only visual fixture installable beside the signed app.
        // This avoids uninstalling the user's build and losing its Drive session.
        debug {
            applicationIdSuffix ".visualreview"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError false
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

