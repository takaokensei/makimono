plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "androidx.navigation.safeargs.kotlin"
    id "kotlin-kapt"
    id "dagger.hilt.android.plugin"
}

// Local, single-user auto-login support: these three keys are read from
// local.properties, which never leaves this machine and is git-ignored.
def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def driveClientId = localProperties.getProperty("drive.clientId", "")
def driveClientSecret = localProperties.getProperty("drive.clientSecret", "")
def driveRefreshToken = localProperties.getProperty("drive.refreshToken", "")
def malClientId = localProperties.getProperty("mal.clientId", "")
def malClientSecret = localProperties.getProperty("mal.clientSecret", "")
def githubApiToken = localProperties.getProperty("github.apiToken", "")

// Release signing: optional dedicated keystore, configured via local.properties
// (release.storeFile / release.storePassword / release.keyAlias / release.keyPassword).
// When absent, local/personal release builds explicitly fall back to the debug
// key so the build never fails silently on a developer machine.
//
// In CI, though, a silent fallback means a release could get published to
// GitHub Releases signed with the well-known debug key without anyone
// noticing. Gradle sets the "CI" project/env property to "true" on GitHub
// Actions runners, so assembleRelease is made to fail loudly there instead,
// forcing RELEASE_KEYSTORE_BASE64 (and friends) to be configured as repo
// secrets before a real release can be published. Set -PallowDebugSigningInCi
// (or the equivalent env var) if a debug-signed CI build is ever intentional.
def releaseStoreFile = localProperties.getProperty("release.storeFile", "")
def hasReleaseSigningConfig = !releaseStoreFile.isEmpty()
def isCiEnv = System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true"
def allowDebugSigningInCi = project.hasProperty("allowDebugSigningInCi") ||
        System.getenv("ALLOW_DEBUG_SIGNING_IN_CI") == "true"

if (!hasReleaseSigningConfig) {
    if (isCiEnv && !allowDebugSigningInCi) {
        throw new GradleException(
            "Refusing to build assembleRelease in CI without a release keystore. " +
            "RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / " +
            "RELEASE_KEY_PASSWORD must be configured as GitHub Actions secrets so " +
            "published releases are never silently signed with the debug key. " +
            "Pass -PallowDebugSigningInCi to override intentionally."
        )
    }
    logger.warn(
        "WARNING: No release.storeFile configured in local.properties. " +
        "Release build will be signed with the DEBUG key. " +
        "This is fine for personal/local builds, but such an APK must not be " +
        "distributed as if it were a production release. " +
        "See local.properties.example for how to configure a real release keystore."
    )
}

android {

    namespace "zechs.drive.stream"

    packagingOptions {
        exclude "META-INF/DEPENDENCIES"
    }

    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "zechs.drive.stream"
        minSdk 21
        targetSdk 33
        versionCode 36
        versionName "1.4.24"
        archivesBaseName = "makimono-v${versionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "DRIVE_CLIENT_ID", "\"${driveClientId}\""
        buildConfigField "String", "DRIVE_CLIENT_SECRET", "\"${driveClientSecret}\""
        buildConfigField "String", "DRIVE_REFRESH_TOKEN", "\"${driveRefreshToken}\""
        buildConfigField "String", "MAL_CLIENT_ID", "\"${malClientId}\""
        buildConfigField "String", "MAL_CLIENT_SECRET", "\"${malClientSecret}\""
        buildConfigField "String", "GITHUB_API_TOKEN", "\"${githubApiToken}\""
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile)
                storePassword localProperties.getProperty("release.storePassword", "")
                keyAlias localProperties.getProperty("release.keyAlias", "")
                keyPassword localProperties.getProperty("release.keyPassword", "")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["extension-*.aar"])
    implementation project(path: ":mpv")

    def exoplayer_version = "2.18.7"
    def moshi_version = "1.15.0"
    def retrofit_version = "2.9.0"
    def room_version = "2.6.1"


    // Room
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Gson
    implementation "com.google.code.gson:gson:2.10.1"

    // Moshi
    implementation "com.squareup.moshi:moshi:$moshi_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    kapt "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"

    // OkHttp
    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.12.0"))
    implementation "com.squareup.okhttp3:okhttp"
    implementation "com.squareup.okhttp3:logging-interceptor"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-moshi:$retrofit_version"

    // Exoplayer
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-dash:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"

    // Datastore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Encrypted SharedPreferences (MAL OAuth tokens)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Glide
    implementation "com.github.bumptech.glide:glide:4.13.2"
    kapt "com.github.bumptech.glide:compiler:4.13.2"
    implementation "com.github.bumptech.glide:okhttp3-integration:4.13.2"

    // Coroutine Lifecycle Scopes
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Dagger hilt
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-compiler:2.51.1"

    // Splash
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Navigational Components
    implementation "androidx.navigation:navigation-fragment-ktx:2.8.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.8.7"

    //Kotlin
    implementation "androidx.core:core-ktx:1.10.1"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // QR Code
    implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.13.11"
    testImplementation "app.cash.turbine:turbine:1.1.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}