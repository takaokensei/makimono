name: Makimono Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Makimono
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Verify Secret Leaks (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: Setup local.properties (Optional Secrets)
        run: |
          touch local.properties
          if [ -n "${{ secrets.DRIVE_CLIENT_ID }}" ]; then
            echo "drive.clientId=${{ secrets.DRIVE_CLIENT_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.DRIVE_CLIENT_SECRET }}" ]; then
            echo "drive.clientSecret=${{ secrets.DRIVE_CLIENT_SECRET }}" >> local.properties
          fi
          if [ -n "${{ secrets.DRIVE_REFRESH_TOKEN }}" ]; then
            echo "drive.refreshToken=${{ secrets.DRIVE_REFRESH_TOKEN }}" >> local.properties
          fi

      - name: Validate Release Secrets
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::Missing required release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Production release cannot be published without dedicated release keystore."
            exit 1
          fi

      - name: Setup release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          {
            echo "release.storeFile=../release.keystore"
            echo "release.storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "release.keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "release.keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> local.properties

      - name: Run lint checks
        run: ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Build Release APKs (Split & Universal)
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signatures
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying: $apk"
            jarsigner -verify -verbose "$apk" | grep -E "(jar verified|WARNING)" || true
            jarsigner -verify "$apk" && echo "OK: $apk" || (echo "FAIL: $apk is not properly signed" && exit 1)
          done

      - name: Collect APKs and generate checksums
        id: collect_apks
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/
          cd release_artifacts
          for apk in *.apk; do
            sha256sum "$apk" | awk '{print $1"  "$2}' > "${apk}.sha256"
          done
          ls -la .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Makimono ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/*.apk
            release_artifacts/*.sha256

      - name: Clean up local secrets
        if: always()
        run: rm -f release.keystore local.properties
