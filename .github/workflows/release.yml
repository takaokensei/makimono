name: Makimono Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Makimono
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify Tag Immutability (T-906)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/checks/check_immutable_tag.py --self-test
          EXISTING_SHA=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.target_commitish' 2>/dev/null || true)
          case "$EXISTING_SHA" in
            *"Not Found"*|*"404"*|*"{"*) EXISTING_SHA="" ;;
          esac
          python3 tools/checks/check_immutable_tag.py \
            --tag "${{ github.ref_name }}" \
            --current-sha "${{ github.sha }}" \
            --existing-sha "$EXISTING_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@2dfa2011c5b2a0f1489bf9e433881c92c1631f88 # v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Verify Secret Leaks (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Setup local.properties (Optional Secrets)
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID || secrets.GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET || secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN || secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          GITHUB_API_TOKEN: ${{ secrets.API_TOKEN_GITHUB || secrets.GITHUB_API_TOKEN || secrets.GH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          touch local.properties
          if [ -n "$DRIVE_CLIENT_ID" ]; then
            echo "drive.clientId=$DRIVE_CLIENT_ID" >> local.properties
          fi
          if [ -n "$DRIVE_CLIENT_SECRET" ]; then
            echo "drive.clientSecret=$DRIVE_CLIENT_SECRET" >> local.properties
          fi
          if [ -n "$DRIVE_REFRESH_TOKEN" ]; then
            echo "drive.refreshToken=$DRIVE_REFRESH_TOKEN" >> local.properties
          fi
          if [ -n "$MAL_CLIENT_ID" ]; then
            echo "mal.clientId=$MAL_CLIENT_ID" >> local.properties
          fi
          if [ -n "$MAL_CLIENT_SECRET" ]; then
            echo "mal.clientSecret=$MAL_CLIENT_SECRET" >> local.properties
          fi
          if [ -n "$GITHUB_API_TOKEN" ]; then
            printf 'github.releaseReadToken=%s\n' "$GITHUB_API_TOKEN" >> local.properties
            printf 'github.apiToken=%s\n' "$GITHUB_API_TOKEN" >> local.properties
          fi
          if [ -n "$TMDB_API_KEY" ]; then
            echo "tmdb.apiKey=$TMDB_API_KEY" >> local.properties
          fi

      - name: Validate Release Secrets
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID || secrets.GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET || secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN || secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.API_TOKEN_GITHUB || secrets.GITHUB_API_TOKEN || secrets.GH_TOKEN }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || \
             [ -z "$RELEASE_STORE_PASSWORD" ] || \
             [ -z "$RELEASE_KEY_ALIAS" ] || \
             [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)."
            exit 1
          fi
          if [ -z "$GITHUB_API_TOKEN" ]; then
            echo "::warning::API_TOKEN_GITHUB / GITHUB_API_TOKEN is not set. In-app updater for private repository will not be able to download assets."
          fi
          if [ -z "$DRIVE_CLIENT_ID" ] || [ -z "$DRIVE_CLIENT_SECRET" ] || [ -z "$DRIVE_REFRESH_TOKEN" ]; then
            echo "::warning::Drive credentials (DRIVE_CLIENT_ID, DRIVE_CLIENT_SECRET, DRIVE_REFRESH_TOKEN) were not found in repository secrets. Embedded Google Drive auto-login will be empty in release builds."
          fi

      - name: Setup release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # GitHub secrets may contain wrapped Base64. Strip whitespace before decoding.
          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.keystore; then
            echo "::error::RELEASE_KEYSTORE_BASE64 could not be decoded. Check that the secret contains only the Base64-encoded keystore."
            exit 1
          fi
          if [ ! -s release.keystore ]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore could not be opened with RELEASE_STORE_PASSWORD and RELEASE_KEY_ALIAS. Confirm the stored keystore, store password, and alias belong together."
            exit 1
          fi
          {
            printf '%s\n' 'release.storeFile=../release.keystore'
            printf 'release.storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'release.keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'release.keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } >> local.properties

      - name: Run lint checks
        run: ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Build Release APKs (Split & Universal)
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signatures
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying: $apk"
            jarsigner -verify -verbose "$apk" | grep -E "(jar verified|WARNING)" || true
            jarsigner -verify "$apk" && echo "OK: $apk" || (echo "FAIL: $apk is not properly signed" && exit 1)
          done

      - name: Collect APKs and generate checksums
        id: collect_apks
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/
          cd release_artifacts
          for apk in *.apk; do
            sha256sum "$apk" | awk '{print $1"  "$2}' > "${apk}.sha256"
          done
          ls -la .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Makimono ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/*.apk
            release_artifacts/*.sha256

      - name: Clean up local secrets
        if: always()
        run: rm -f release.keystore local.properties
