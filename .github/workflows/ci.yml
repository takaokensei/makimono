name: Makimono CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_instrumented:
        description: 'Run instrumented tests on headless Android TV emulator (T-905 / D-90)'
        required: false
        default: 'false'
        type: boolean

jobs:
  validate:
    name: Lint, Test & Assemble Debug
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@2dfa2011c5b2a0f1489bf9e433881c92c1631f88 # v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Verify repository claims
        run: bash scripts/verify-claims.sh

      - name: Verify Secret Leaks (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run static quality guards
        run: |
          python3 tools/checks/check_strings.py
          python3 tools/checks/check_no_direct_log.py
          python3 tools/checks/check_readme_claims.py
          python3 tools/checks/check_kotlin_literals.py
          python3 tools/checks/check_kotlin_style.py
          python3 tools/checks/check_immutable_tag.py --self-test
          python3 tools/checks/baseline_diff.py app/lint-baseline.xml

      - name: Run lint checks
        run: ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
